{% extends 'base.html' %}
{% block title %}{{ 'Edit' if supplier else 'New' }} Supplier{% endblock %}
{% block page_title %}{{ 'Edit' if supplier else 'New' }} Supplier{% endblock %}
{% block content %}
<div style="max-width:700px"><div class="card">
  <div class="card-header"><span class="card-title"><i class="fas fa-building"></i> {{ 'Edit' if supplier else 'Add' }} Supplier</span></div>
  <div class="card-body"><form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
      <div class="form-group"><label class="form-label">Company Name *</label><input type="text" name="name" class="form-control" value="{{ supplier.name if supplier else '' }}" required></div>
      <div class="form-group"><label class="form-label">Contact Person</label><input type="text" name="contact_person" class="form-control" value="{{ supplier.contact_person if supplier else '' }}"></div>
      <div class="form-group"><label class="form-label">Phone</label><input type="text" name="phone" class="form-control" value="{{ supplier.phone if supplier else '' }}"></div>
      <div class="form-group"><label class="form-label">Email</label><input type="email" name="email" class="form-control" value="{{ supplier.email if supplier else '' }}"></div>
      <div class="form-group"><label class="form-label">City</label><input type="text" name="city" class="form-control" value="{{ supplier.city if supplier else '' }}"></div>
      <div class="form-group"><label class="form-label">Region</label><input type="text" name="region" class="form-control" value="{{ supplier.region if supplier else '' }}"></div>
      <div class="form-group"><label class="form-label">TIN Number</label><input type="text" name="tin_number" class="form-control" value="{{ supplier.tin_number if supplier else '' }}"></div>
      <div class="form-group"><label class="form-label">Payment Terms (days)</label><input type="number" name="payment_terms" class="form-control" value="{{ supplier.payment_terms if supplier else '30' }}"></div>
    </div>
    <div class="form-group"><label class="form-label">Address</label><textarea name="address" class="form-control" rows="2">{{ supplier.address if supplier else '' }}</textarea></div>
    <div class="form-group"><label class="form-label">Notes</label><textarea name="notes" class="form-control" rows="2">{{ supplier.notes if supplier else '' }}</textarea></div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> {{ 'Update' if supplier else 'Add' }} Supplier</button>
      <a href="{{ url_for('suppliers.index') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form></div>
</div></div>{% endblock %}
