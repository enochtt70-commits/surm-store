{% extends 'base.html' %}
{% block title %}{{ 'Edit' if expense else 'New' }} Expense{% endblock %}
{% block page_title %}{{ 'Edit' if expense else 'Record' }} Expense{% endblock %}
{% block content %}
<div style="max-width:560px"><div class="card">
  <div class="card-header"><span class="card-title"><i class="fas fa-receipt"></i> {{ 'Edit' if expense else 'Record' }} Expense</span></div>
  <div class="card-body"><form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group"><label class="form-label">Description *</label><input type="text" name="description" class="form-control" value="{{ expense.description if expense else '' }}" required></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
      <div class="form-group"><label class="form-label">Category *</label>
        <select name="category" class="form-control form-select" required>
          {% for cat in ['Salaries','Restocking','Transport','Utilities','Rent','Miscellaneous'] %}
          <option value="{{ cat }}" {{ 'selected' if expense and expense.category==cat }}>{{ cat }}</option>{% endfor %}
        </select>
      </div>
      <div class="form-group"><label class="form-label">Amount (GHS) *</label><input type="number" step="0.01" name="amount" class="form-control" value="{{ expense.amount if expense else '' }}" required></div>
      <div class="form-group"><label class="form-label">Payment Method</label>
        <select name="payment_method" class="form-control form-select">
          <option value="cash" {{ 'selected' if not expense or expense.payment_method=='cash' }}>Cash</option>
          <option value="momo" {{ 'selected' if expense and expense.payment_method=='momo' }}>Mobile Money</option>
          <option value="bank" {{ 'selected' if expense and expense.payment_method=='bank' }}>Bank Transfer</option>
        </select>
      </div>
      <div class="form-group"><label class="form-label">Date *</label><input type="date" name="expense_date" class="form-control" value="{{ expense.expense_date if expense else today }}" required></div>
    </div>
    <div class="form-group"><label class="form-label">Reference / Receipt #</label><input type="text" name="reference" class="form-control" value="{{ expense.reference if expense else '' }}"></div>
    <div class="form-group"><label class="form-label">Notes</label><textarea name="notes" class="form-control" rows="2">{{ expense.notes if expense else '' }}</textarea></div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> {{ 'Update' if expense else 'Record' }} Expense</button>
      <a href="{{ url_for('accounting.expenses') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form></div>
</div></div>{% endblock %}
