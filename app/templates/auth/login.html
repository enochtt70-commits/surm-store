<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Login - Surm Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#0f2d5c,#2563eb);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
    .card{background:#fff;border-radius:1.25rem;box-shadow:0 25px 60px rgba(0,0,0,.25);padding:2.5rem;width:100%;max-width:420px}
    .logo{text-align:center;margin-bottom:2rem}
    .logo-icon{width:68px;height:68px;background:linear-gradient(135deg,#2563eb,#1d4ed8);border-radius:18px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:2rem;font-weight:800;margin-bottom:.75rem}
    .logo h1{font-size:1.6rem;font-weight:700;color:#0f172a}.logo p{color:#64748b;font-size:.85rem;margin-top:.3rem}
    .form-group{margin-bottom:1.2rem}
    label{display:block;font-size:.84rem;font-weight:500;color:#374151;margin-bottom:.4rem}
    .input-wrap{position:relative}
    .input-wrap i{position:absolute;left:.8rem;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:.9rem}
    input[type=text],input[type=password]{width:100%;padding:.65rem .8rem .65rem 2.4rem;border:1.5px solid #d1d5db;border-radius:.5rem;font-size:.9rem;outline:none;font-family:'Inter',sans-serif;transition:border-color .15s,box-shadow .15s}
    input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.15)}
    .remember{display:flex;align-items:center;gap:.5rem;font-size:.84rem;color:#374151;margin-bottom:1.2rem}
    .btn{width:100%;padding:.75rem;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;border:none;border-radius:.5rem;font-size:.95rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}
    .btn:hover{opacity:.9}
    .alert{padding:.7rem 1rem;border-radius:.5rem;margin-bottom:1rem;font-size:.84rem;display:flex;align-items:center;gap:.5rem}
    .alert-danger{background:#fef2f2;border:1px solid #fca5a5;color:#991b1b}
    .alert-success{background:#f0fdf4;border:1px solid #86efac;color:#166534}
    .alert-info{background:#f0f9ff;border:1px solid #7dd3fc;color:#075985}
    .hint{margin-top:1.5rem;padding:1rem;background:#f8fafc;border-radius:.5rem;font-size:.78rem;color:#64748b;border:1px solid #e2e8f0}
    .hint strong{display:block;color:#374151;margin-bottom:.4rem}
    .hint ul{list-style:none;padding:0}.hint li{padding:.12rem 0}
    .footer{text-align:center;margin-top:1.5rem;font-size:.75rem;color:#94a3b8}
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">S</div>
    <h1>Surm Store</h1>
    <p>Management System &bull; Bogoso, Western Region, Ghana</p>
  </div>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat,msg in messages %}
    <div class="alert alert-{{ 'danger' if cat=='error' else cat }}">
      <i class="fas fa-{{ 'check-circle' if cat=='success' else 'exclamation-circle' }}"></i> {{ msg }}
    </div>
    {% endfor %}
  {% endwith %}
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label>Username</label>
      <div class="input-wrap"><i class="fas fa-user"></i>
        <input type="text" name="username" placeholder="Enter username" required autofocus>
      </div>
    </div>
    <div class="form-group">
      <label>Password</label>
      <div class="input-wrap"><i class="fas fa-lock"></i>
        <input type="password" name="password" placeholder="Enter password" required>
      </div>
    </div>
    <div class="remember">
      <input type="checkbox" name="remember" id="rem" style="width:auto;padding:0">
      <label for="rem" style="margin:0;font-weight:400">Remember me for 8 hours</label>
    </div>
    <button type="submit" class="btn"><i class="fas fa-sign-in-alt"></i> Sign In</button>
  </form>
  <div class="hint">
    <strong>Default Login Credentials</strong>
    <ul><!--
      <li><b>Super Admin:</b> admin / Admin@123</li>
      <li><b>Owner:</b> peterbrakoh / Peter@123</li>
      <li><b>Manager:</b> victoria / Victoria@123</li>
      <li><b>Accountant:</b> enoch / Enoch@123</li>
      <li><b>Shopkeeper:</b> michael / Michael@123</li> -->
    </ul>
  </div>
</div>
<div class="footer">&copy; 2026 Surm Store</div>
</body></html>
