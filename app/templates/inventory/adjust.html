{% extends 'base.html' %}
{% block title %}Adjust Stock{% endblock %}
{% block page_title %}Stock Adjustment{% endblock %}
{% block content %}
<div style="max-width:480px;">
  <div class="card">
    <div class="card-header">
      <span class="card-title"><i class="fas fa-edit"></i> Adjust Stock</span>
      <a href="{{ url_for('inventory.index') }}" class="btn btn-secondary btn-sm"><i class="fas fa-arrow-left"></i> Back</a>
    </div>
    <div class="card-body">
      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
          <label class="form-label">Product *</label>
          <select name="product_id" class="form-control form-select" required>
            <option value="">-- Select Product --</option>
            {% for p in products %}
            <option value="{{ p.id }}" {% if request.args.get('product') == p.id|string %}selected{% endif %}>
              {{ p.name }} (Stock: {{ p.current_stock }} {{ p.unit }})
            </option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Adjustment Type *</label>
          <select name="adjustment_type" class="form-control form-select" required>
            <option value="add">Add Stock</option>
            <option value="remove">Remove Stock</option>
            <option value="set">Set Exact Quantity</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Quantity *</label>
          <input type="number" name="quantity" class="form-control" min="1" required>
        </div>
        <div class="form-group">
          <label class="form-label">Notes / Reason</label>
          <textarea name="notes" class="form-control" rows="3" placeholder="Reason for adjustment..."></textarea>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Apply Adjustment</button>
          <a href="{{ url_for('inventory.index') }}" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
